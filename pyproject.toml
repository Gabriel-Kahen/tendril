[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tendril"
version = "0.1.0"
description = "Developmental evolution of contractile three-dimensional organisms"
requires-python = ">=3.12,<3.14"
dependencies = ["mujoco==3.14.0", "numpy>=2.2,<3", "scipy>=1.15,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
tendril = "tendril.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
